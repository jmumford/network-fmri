tr: 1.49
dummy_scans: 7

# Stop-signal.
# Conditions in trial_type: go, stop_success, stop_failure.
#
# RT modelling (Mumford et al. 2023, ConstDurRTDur; biorxiv 528677):
# the pooled response_time regressor is restricted to correct go responses.
#   go (correct, RT >= 0.2)  ConstDur + RTDur
#   stop_success             ConstDur only -- no response, so no RT
#   stop_failure             ConstDur only -- RTs on failed inhibition are
#                            atypical (partial response programming), so
#                            modelling them as RT-modulated would bleed
#                            inhibition-failure variance into the contrasts
# This keeps stop_success-go and stop_failure-go from absorbing RT variance
# through the go regressor while avoiding RT modelling on trials whose RT is
# not a clean motor-readiness signal.
#
# Every subset is restricted to trial_id == 'test_trial': break rows can
# retain a condition label without being behavioural trials.

regressors:
  go:
    amplitude: 1
    duration: duration
    subset: >-
      trial_id == 'test_trial' and trial_type == 'go'
      and key_press == correct_response and response_time >= 0.2

  stop_success:
    amplitude: 1
    duration: duration
    subset: "trial_id == 'test_trial' and trial_type == 'stop_success'"

  stop_failure:
    amplitude: 1
    duration: duration
    subset: "trial_id == 'test_trial' and trial_type == 'stop_failure'"

  response_time:
    amplitude: 1
    duration: response_time
    subset: >-
      trial_id == 'test_trial' and trial_type == 'go'
      and key_press == correct_response and response_time >= 0.2

  # Nuisance regressors are restricted to go trials: a successful stop has
  # key_press == -1 by design and must not be counted as an omission.
  go_omission:
    amplitude: 1
    duration: duration
    subset: >-
      trial_id == 'test_trial' and trial_type == 'go'
      and key_press == -1

  go_commission:
    amplitude: 1
    duration: duration
    subset: >-
      trial_id == 'test_trial' and trial_type == 'go'
      and key_press != correct_response and key_press != -1
      and response_time >= 0.2

  go_rt_fast:
    amplitude: 1
    duration: duration
    subset: >-
      trial_id == 'test_trial' and trial_type == 'go'
      and response_time >= 0 and response_time < 0.2

  break_with_performance_feedback:
    amplitude: 1
    duration: duration
    subset: "trial_id in ('break', 'break_with_performance_feedback')"

contrasts:
  go: "go"
  stop_success: "stop_success"
  stop_failure: "stop_failure"
  stop_success-go: "stop_success - go"
  stop_failure-go: "stop_failure - go"
  stop_success-stop_failure: "stop_success - stop_failure"
  stop_failure-stop_success: "stop_failure - stop_success"
  task-baseline: "1/3 * go + 1/3 * stop_failure + 1/3 * stop_success"
  response_time: "response_time"
