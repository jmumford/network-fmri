[project]
name = "network-fmri"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jmumford", email = "jmumford@stanford.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib==3.11.2",
    "nibabel>=5.4.2",
    "nilearn>=0.14.1",
    "numpy==2.2.6",
    "pandas==2.3.2",
    "pillow==12.2.0",
    "pyyaml>=6.0.3",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "seaborn>=0.13.2",
    "statsmodels==0.14.6",
]

[project.scripts]
network-fmri = "network_fmri:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"
